[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.builder"

[deploy]
startCommand = "/opt/build-graph.sh"
restartPolicyType = "NEVER"
# cronSchedule DISABLED 2026-08-29 for the cost wind-down.
# TO REACTIVATE: uncomment the line below and redeploy.
# cronSchedule = "0 4 * * 1,4"
numReplicas = 1

# Graph builder runs twice weekly (Monday + Thursday 4:00 AM UTC)
# GTFS coverage window is ~4 days, so twice-weekly prevents expiry
# Runs 90 min after timetable-loader's daily 2:30 AM GTFS generation
# To trigger manually: redeploy from Railway dashboard or push a commit
